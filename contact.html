<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Samuel Olasijibomi</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>
            <h2>SIJI<span>.</span></h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Planner</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">

        <section class="contact-heading">

            <p>GET IN TOUCH</p>

            <h1>Contact Me</h1>

            <p>
                Have a question, project idea or opportunity?
                Feel free to get in touch using the form below.
            </p>

        </section>

        <section class="contact-form-section">

            <form id="contactForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                </div>

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email address"
                    >

                </div>

                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>

                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        rows="6"
                        placeholder="Write your message here"
                    ></textarea>

                </div>

                <button type="submit">
                    Send Message
                </button>

                <p id="formMessage"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Samuel Olasijibomi. All Rights Reserved.</p>
    </footer>

    <script src="js/contact.js"></script>

</body>

</html>
